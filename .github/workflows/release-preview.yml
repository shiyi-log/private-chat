name: Release preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version (vMAJOR.MINOR.PATCH-preview.N)
        required: true
        default: v0.2.0-preview.1
        type: string
      publish:
        description: Publish a GitHub prerelease after required CI and environment checks
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: private-chat-release-preview
  cancel-in-progress: false

jobs:
  validate:
    name: Validate preview request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate inputs before verification
        env:
          PREVIEW_VERSION: ${{ inputs.version }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREVIEW_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
          if [[ "$PUBLISH_REQUESTED" == true ]]; then
            test "$GITHUB_REPOSITORY" = shiyi-log/private-chat
            test "$GITHUB_REF" = refs/heads/main
          fi

  verify:
    name: Required release verification
    needs: validate
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare reproducible source candidate
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Archive the exact verified revision
        env:
          PREVIEW_VERSION: ${{ inputs.version }}
        run: python3 scripts/ci/package_preview.py --version "$PREVIEW_VERSION" --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/release-preview"
      - name: Verify every published candidate byte
        working-directory: ${{ runner.temp }}/release-preview
        run: sha256sum --check SHA256SUMS
      - name: Write reviewable release notes
        env:
          PREVIEW_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/preview-notes.md" <<EOF
          Private Chat $PREVIEW_VERSION source preview from commit $GITHUB_SHA.

          This prerelease contains the consolidated Server, Desktop, Android, iOS and Docs sources, a manifest and SHA-256 checksums. Required static, affected Go, full Go and Android native debug build gates passed in workflow run $GITHUB_RUN_ID.

          Native app packages are not attached by this workflow. Separate macOS Debug and iOS simulator builds are manual checks; this source release does not establish signed iOS distribution, notarization, production readiness, real SMS delivery or complete multi-client message/file acceptance.

          The repository has open dependency security alerts that have not all been assessed for runtime reachability or exploitability. This preview is for source evaluation and local development.

          See docs/ci-cd.md for build commands and remaining acceptance requirements.
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-preview-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-preview/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes-${{ github.sha }}
          path: ${{ runner.temp }}/preview-notes.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified source prerelease
    needs: prepare
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview-release
    permissions:
      contents: write
    steps:
      - name: Require explicit environment setup
        env:
          PUBLICATION_ENABLED: ${{ vars.PRIVATE_CHAT_RELEASE_ENABLED }}
        run: test "$PUBLICATION_ENABLED" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-preview-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-preview
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes-${{ github.sha }}
          path: ${{ runner.temp }}/release-notes
      - name: Verify approved assets and create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-preview"
          sha256sum --check SHA256SUMS
          if git -C "$GITHUB_WORKSPACE" show-ref --verify --quiet "refs/tags/$PREVIEW_VERSION"; then
            test "$(git -C "$GITHUB_WORKSPACE" rev-parse "$PREVIEW_VERSION^{commit}")" = "$GITHUB_SHA"
          fi
          gh release create "$PREVIEW_VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Private Chat $PREVIEW_VERSION" --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes/preview-notes.md" ./*
